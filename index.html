<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B2A1E">
<title>Mi Entreno</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:#0B2A1E;color:#fff;padding:16px 16px 90px;max-width:520px;margin:auto}
h1{font-family:Cambria,serif;font-size:26px;margin:4px 0 14px}h2{font-family:Cambria,serif;font-size:18px;margin:0 0 10px}
.card{background:#14532D;border-radius:14px;padding:14px;margin-bottom:14px}
.q{margin-bottom:12px}.r{display:flex;gap:6px;margin-top:6px}
.r button{flex:1;padding:12px 0;border:0;border-radius:10px;background:#0B2A1E;color:#fff;font-size:16px}
.r button.on{background:#B6F03C;color:#0B2A1E;font-weight:bold}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:0;font-size:16px;margin:4px 0 10px;font-family:inherit}
label{font-size:14px;color:#CFE3D6}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:#B6F03C;color:#0B2A1E;font-size:17px;font-weight:bold}
.sec{background:#0B2A1E;color:#B6F03C;border:1px solid #B6F03C;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#061a12;max-width:520px;margin:auto}
nav button{flex:1;padding:16px 0;border:0;background:none;color:#CFE3D6;font-size:15px}nav button.on{color:#B6F03C;font-weight:bold}
.tl{display:flex;align-items:center;gap:14px}.dot{width:64px;height:64px;border-radius:50%;flex:none}
.g{background:#3DDC6A}.y{background:#F5C518}.r2{background:#F2545B}.n{background:#5B6B61}
.bars{display:flex;gap:10px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:12px}
.bars i{display:block;background:#B6F03C;border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.h{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #1d6b3a;font-size:14px}
.h button{background:none;border:0;color:#F2545B;font-size:16px}
#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#B6F03C;color:#0B2A1E;padding:8px 16px;border-radius:20px;display:none;z-index:9}
small{color:#CFE3D6}.hide{display:none}
</style></head><body>
<div id="msg"></div>
<h1>Mi Entreno</h1>

<section id="t-hoy">
 <div class="card"><h2>Cuestionario matinal</h2><small>1 = muy mal · 5 = muy bien</small><div id="qs" style="margin-top:10px"></div>
 <button class="go" id="saveW">Guardar cuestionario</button></div>
</section>

<section id="t-ses" class="hide">
 <div class="card"><h2>Registrar sesión</h2>
 <label>Fecha</label><input type="date" id="date">
 <label>Tipo</label><select id="type"><option>Gimnasio superior</option><option>Gimnasio piernas</option><option>Velocidad y balón</option><option>Carrera</option><option>Entreno equipo</option><option>Partido</option><option>Otro</option></select>
 <label>Duración (minutos)</label><input type="number" id="min" inputmode="numeric" placeholder="60">
 <label>Esfuerzo percibido (RPE): <b id="rv">5</b> / 10</label><input type="range" id="rpe" min="0" max="10" value="5">
 <label>Ejercicios y pesos / notas</label><textarea id="notes" rows="3" placeholder="Sentadilla 4x6 80 kg..."></textarea>
 <button class="go" id="saveS">Guardar sesión</button></div>
</section>

<section id="t-res" class="hide">
 <div class="card"><div class="tl"><div class="dot n" id="dot"></div><div><h2 id="tt" style="margin:0">Sin datos</h2><span id="tm"></span></div></div></div>
 <div class="card"><h2>Carga semanal (RPE × min)</h2><div class="bars" id="bars"></div><p id="ls"></p></div>
 <div class="card"><h2>Últimas sesiones</h2><div id="hist"></div></div>
 <button class="go sec" id="exp">Exportar copia (CSV)</button>
</section>

<nav><button data-t="hoy" class="on">Hoy</button><button data-t="ses">Sesión</button><button data-t="res">Resumen</button></nav>

<script>
const $=s=>document.querySelector(s);
let db;try{db=JSON.parse(localStorage.getItem('ent'))}catch(e){}db=db||{w:[],s:[]};
const save=()=>localStorage.setItem('ent',JSON.stringify(db));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',1800)};

const Q=[['sleep','Calidad del sueño'],['energy','Energía'],['legs','Músculos (5 = sin dolor)'],['calm','Calma (5 = sin estrés)'],['mood','Ánimo']];
const cur={};
$('#qs').innerHTML=Q.map(([k,t])=>`<div class="q"><b>${t}</b><div class="r" data-k="${k}">${[1,2,3,4,5].map(n=>`<button data-v="${n}">${n}</button>`).join('')}</div></div>`).join('');
$('#qs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=b.parentNode;cur[r.dataset.k]=+b.dataset.v;[...r.children].forEach(x=>x.classList.toggle('on',x===b))};
$('#saveW').onclick=()=>{if(Q.some(([k])=>!cur[k])){toast('Responde las 5 preguntas');return}
 db.w=db.w.filter(x=>x.d!==today());db.w.push({d:today(),...cur});save();toast('Guardado');render()};

$('#date').value=today();
$('#rpe').oninput=e=>$('#rv').textContent=e.target.value;
$('#saveS').onclick=()=>{const m=+$('#min').value;if(!m){toast('Pon la duración');return}
 db.s.push({d:$('#date').value||today(),t:$('#type').value,m,r:+$('#rpe').value,n:$('#notes').value.trim()});
 save();$('#notes').value='';$('#min').value='';toast('Sesión guardada');render()};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 ['hoy','ses','res'].forEach(t=>$('#t-'+t).classList.toggle('hide',t!==b.dataset.t));render()});

const sc=w=>(w.sleep+w.energy+w.legs+w.calm+w.mood)/5;
function render(){
 const ws=[...db.w].sort((a,b)=>a.d<b.d?-1:1);
 const ld=(a,b)=>db.s.filter(s=>s.d>=daysAgo(b)&&s.d<=daysAgo(a)).reduce((t,s)=>t+s.m*s.r,0);
 const wk=[0,1,2,3].map(i=>ld(7*i,7*i+6));
 const mean=wk.reduce((a,b)=>a+b,0)/4;
 const first=db.s.length?db.s.map(s=>s.d).sort()[0]:null;
 const ratio=first&&first<=daysAgo(14)&&mean>0?wk[0]/mean:null;
 const last=ws.slice(-2).map(sc);
 const avg=last.length?last.reduce((a,b)=>a+b,0)/last.length:null;
 let c='n',t='Sin datos',m='Rellena el cuestionario matinal para recibir recomendaciones.';
 if(avg!==null){
  const hi=ratio!==null&&ratio>1.3,lastS=sc(ws[ws.length-1]);
  if(avg<=2.2||(lastS<=2&&hi)){c='r2';t='Descansa';m='Solo movilidad o paseo. Tu recuperación está baja.'}
  else if(avg<=3.2||hi){c='y';t='Precaución';m=hi&&avg>3.2?'Carga semanal alta frente a tu media. Baja la intensidad hoy.':'Recuperación justa. Entrena con menos volumen o intensidad.'}
  else{c='g';t='Listo para entrenar';m='Buena recuperación. Sigue el plan.'}
 }
 $('#dot').className='dot '+c;$('#tt').textContent=t;$('#tm').textContent=m;
 const mx=Math.max(...wk,1);
 $('#bars').innerHTML=[3,2,1,0].map(i=>`<div><i style="height:${wk[i]/mx*80}px"></i>${wk[i]}<br><small>${i?'-'+i+' sem':'esta'}</small></div>`).join('');
 $('#ls').innerHTML=ratio===null?'<small>Con 2 semanas de datos verás si tu carga sube demasiado.</small>':`Carga de esta semana: <b>${Math.round(ratio*100)}%</b> de tu media de 4 semanas.`;
 $('#hist').innerHTML=db.s.map((s,i)=>({...s,i})).sort((a,b)=>a.d<b.d?1:-1).slice(0,8).map(s=>`<div class="h"><span><b>${s.d.slice(5)}</b> ${esc(s.t)} · ${s.m} min · RPE ${s.r}${s.n?'<br><small>'+esc(s.n)+'</small>':''}</span><button data-i="${s.i}">✕</button></div>`).join('')||'<small>Aún no hay sesiones.</small>';
}
$('#hist').onclick=e=>{const b=e.target.closest('button');if(!b||!confirm('¿Borrar sesión?'))return;db.s.splice(+b.dataset.i,1);save();render()};
$('#exp').onclick=()=>{const rows=['tipo,fecha,sueno,energia,musculos,calma,animo,minutos,rpe,notas',
 ...db.w.map(w=>['bienestar',w.d,w.sleep,w.energy,w.legs,w.calm,w.mood,'','',''].join(',')),
 ...db.s.map(s=>['sesion '+s.t,s.d,'','','','','',s.m,s.r,'"'+s.n.replace(/"/g,'""')+'"'].join(','))];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='mi-entreno.csv';a.click()};
render();
</script></body></html>
